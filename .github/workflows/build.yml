name: Build Desktop App

on:
  push:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller garminconnect requests

      - name: Build .exe
        run: pyinstaller --onefile --windowed --name "CRONOS" desktop/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRONOS-Windows
          path: dist/CRONOS.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller garminconnect requests

      - name: Build .app
        run: pyinstaller --onefile --windowed --name "CRONOS" desktop/main.py

      - name: Create .dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "CRONOS" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "dist/CRONOS.dmg" \
            "dist/CRONOS.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRONOS-Mac
          path: dist/CRONOS.dmg

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CRONOS-Windows
          path: dist/

      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: CRONOS-Mac
          path: dist/

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CRONOS Desktop App
          make_latest: true
          files: |
            dist/CRONOS.exe
            dist/CRONOS.dmg
          body: |
            ## CRONOS — Connexion montre

            Télécharge l'app, connecte ta montre Garmin ou Polar, et tes données sont collectées automatiquement chaque nuit.

            ### Installation
            - **Windows** : télécharge `CRONOS.exe` et double-clique
            - **Mac** : télécharge `CRONOS.dmg`, ouvre-le et glisse l'app dans Applications
